name: Generate Composer lock

on:
  push:
    branches:
      - feature/dependency-lock

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/dependency-lock

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, json, mbstring, openssl, pdo, pdo_mysql, xmlreader, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Generate lock file
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already up to date"
            exit 0
          fi
          git commit -m "Lock Composer dependencies"
          git push origin HEAD:feature/dependency-lock
